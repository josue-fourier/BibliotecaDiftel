services:
  # 1. Nginx: Punto de entrada único
  nginx:
    image: nginx:alpine
    container_name: telematica-nginx
    restart: unless-stopped
    ports:
      - "1500:80"
    # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/landing:/var/www/landing:ro
      - /srv/data/recursos:/var/www/recursos:ro
      - ./django_app/static:/var/www/django_static:ro
    depends_on:
      - web-django

  # 2. Django Backend (Gunicorn)
  web-django:
    build: ./django_app
    container_name: telematica-django
    restart: unless-stopped
    command: gunicorn "dashboard_interna.wsgi:application" --bind 0.0.0.0:8000 --access-logfile - --error-logfile - --log-level info --capture-output --workers 3 --timeout 120
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=dashboard_interna.settings
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - PYTHONUNBUFFERED=1
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - ./django_app/dashboard-interna:/app
      - /srv/data/buzon:/data/buzon
      - /srv/data/recursos:/data/recursos:ro
      - ./django_app/static:/app/staticfiles
    depends_on:
      clamav:
        condition: service_started
      db:
        condition: service_started

  # 2.5 Base de Datos (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: telematica-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # 3. ClamAV Daemon (Escaneo antivirus rápido por TCP)
  clamav:
    image: clamav/clamav:latest
    container_name: telematica-clamav
    restart: unless-stopped
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
    volumes:
      - ./clamav_data:/var/lib/clamav
    # ClamAV usa ~1.2 GB de RAM cargando las firmas en memoria

  # 4. ClamAV Watcher (Python)
  clamav-watcher:
    build: ./clamav_watcher
    container_name: telematica-watcher
    restart: unless-stopped
    networks:
      - default
      - red_n8n
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - N8N_WEBHOOK_CLEAN=${N8N_WEBHOOK_CLEAN}
      - N8N_WEBHOOK_THREAT=${N8N_WEBHOOK_THREAT}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    volumes:
      - /srv/data/buzon:/data/buzon
    depends_on:
      clamav:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}

  filebrowser:
    image: filebrowser/filebrowser
    ports:
      - "1501:80"
    volumes:
      - /srv/data/buzon/safe:/srv/safe
      - /srv/data/recursos:/srv/recursos
      - ./filebrowser.db:/database/filebrowser.db

  # 5. Docmost (Wiki Colaborativa)
  docmost:
    image: docmost/docmost:latest
    container_name: telematica-docmost
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      APP_URL: ${DOCMOST_APP_URL:-http://localhost:3000}
      APP_SECRET: ${DOCMOST_APP_SECRET:-replace-me-with-a-strong-secret}
      DATABASE_URL: ${DOCMOST_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public}
      REDIS_URL: ${DOCMOST_REDIS_URL:-redis://redis:6379}
    volumes:
      - /srv/data/docmost_storage:/app/data/storage

  # 6. Redis para Docmost (Caché y Background Jobs)
  redis:
    image: redis:7-alpine
    container_name: telematica-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ./data/redis_data:/data


networks:
  red_n8n:
    external: true
    name: n8n_default
