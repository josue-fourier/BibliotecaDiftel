services:
  # 1. Nginx: Punto de entrada único
  nginx:
    image: nginx:alpine
    container_name: telematica-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/landing:/var/www/landing:ro
      - ./data/quartz_public:/var/www/quartz:ro
      - ./data/recursos:/var/www/recursos:ro
      - ./django_app/static:/var/www/django_static:ro
    depends_on:
      - web-django

  # 2. Django Backend (Gunicorn)
  web-django:
    build: ./django_app
    container_name: telematica-django
    restart: unless-stopped
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - PYTHONUNBUFFERED=1
    volumes:
      - ./django_app:/app
      - ./data/buzon_storage:/app/storage
      - ./django_app/static:/app/staticfiles
    depends_on:
      clamav:
        condition: service_started

  # 3. ClamAV Daemon (Escaneo antivirus rápido por TCP)
  clamav:
    image: clamav/clamav:latest
    container_name: telematica-clamav
    restart: unless-stopped
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
    volumes:
      - ./clamav_data:/var/lib/clamav
    # ClamAV usa ~1.2 GB de RAM cargando las firmas en memoria
