{% load static %}
<!DOCTYPE html>
<html lang="es" data-theme="diftel">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca Diftel Admin{% endblock %}</title>

    <!-- Tailwind CSS (Compilado) -->
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    
    <!-- HTMX -->
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body class="bg-base-100 text-neutral min-h-screen flex flex-col" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    
    <!-- Navbar Premium Estilo Diftel -->
    <nav class="navbar bg-white/70 backdrop-blur-md border-b border-white/50 shadow-sm sticky top-0 z-50">
        <div class="flex-1">
            <a href="/" class="btn btn-ghost normal-case text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
                Biblioteca Diftel Admin
            </a>
        </div>
        <div class="flex-none gap-2">
            {% if user.is_authenticated %}
                <span class="text-sm font-medium">Hola, {{ user.username }}</span>
                <a href="{% url 'admin:logout' %}" class="btn btn-sm btn-outline btn-error">Salir</a>
            {% endif %}
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="flex-grow container mx-auto p-4 animate-fade-in">
        {% block content %}
        {% endblock content %}
    </main>

    <!-- Footer -->
    <footer class="footer footer-center p-4 bg-neutral text-neutral-content">
        <aside>
            <p>Copyright © 2026 - Departamento de Ingeniería Electrónica - UTFSM</p>
        </aside>
    </footer>
    
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        })
    </script>
</body>
</html>
